<!DOCTYPE html>
<html lang="pt-PT">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>M. Cavaleiro® | Assistência Técnica Especializada</title>
  <meta name="description" content="Assistência Técnica e Reparação ao Domicílio: Selecione o seu equipamento e marca.">
  <style>
    :root {
      --bg: #000000;
      --surface: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #2997ff;
      --green: #30d158;
      --text: #f5f5f7;
      --text-sub: #86868b;
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      line-height: 1.5;
      padding: clamp(12px, 3vw, 24px);
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 40px;
      padding-top: 20px;
    }

    h1 {
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--text-sub);
      font-size: 1.1rem;
    }

    /* Selection Steps */
    .step-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
      backdrop-filter: blur(10px);
    }

    .step-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
    }

    .step-number {
      background: var(--accent);
      color: #fff;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 0.9rem;
      font-weight: 800;
    }

    /* Grid Buttons */
    .btn-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn-select {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-select:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-select.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 4px 15px rgba(41, 151, 255, 0.3);
    }

    /* Locations Grid */
    .search-bar {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      padding: 14px 20px;
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 20px;
      outline: none;
    }

    .search-bar:focus {
      border-color: var(--accent);
    }

    .locations-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
      max-height: 400px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .locations-grid::-webkit-scrollbar { width: 6px; }
    .locations-grid::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }

    .location-card {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 16px;
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .location-card:hover {
      background: rgba(48, 209, 88, 0.15);
      border-color: var(--green);
      color: #fff;
    }

    .location-card span { font-weight: 700; color: var(--green); }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>M. CAVALEIRO®</h1>
      <p class="subtitle">Agendamento Inteligente de Assistência Técnica</p>
    </header>

    <!-- PASSO 1: EQUIPAMENTO -->
    <div class="step-box" id="step1">
      <div class="step-title"><span class="step-number">1</span> Selecione o Equipamento</div>
      <div class="btn-grid" id="equipmentGrid">
        <!-- Preenchido via JS -->
      </div>
    </div>

    <!-- PASSO 2: MARCA (Só mostra as marcas correspondentes) -->
    <div class="step-box hidden" id="step2">
      <div class="step-title"><span class="step-number">2</span> Qual é a Marca?</div>
      <div class="btn-grid" id="brandsGrid">
        <!-- Preenchido via JS dinamicamente -->
      </div>
    </div>

    <!-- PASSO 3: LOCALIDADE (Gera o link final) -->
    <div class="step-box hidden" id="step3">
      <div class="step-title"><span class="step-number">3</span> Onde precisa de assistência?</div>
      
      <p id="summaryText" style="color:var(--accent); font-weight:600; margin-bottom:15px; font-size: 1.1rem;"></p>
      
      <input type="text" id="locSearch" class="search-bar" placeholder="🔍 Escreva a sua localidade (ex: Almada, Sintra...)" onkeyup="filterLocations()">
      <div class="locations-grid" id="locationsGrid">
        <!-- Preenchido via JS dinamicamente -->
      </div>
    </div>

  </div>

  <script>
    // BASE DE DADOS ESTRITA: Equipamentos e as suas Marcas reais
    const dataMatrix = {
      "Máquina de Lavar": {
        icon: "🧺",
        brands: ["Bosch", "Siemens", "Balay", "LG", "Samsung", "Whirlpool", "AEG", "Electrolux", "Zanussi", "Indesit", "Candy", "Hoover", "Miele", "Beko", "Ariston", "Becken", "Kunft"]
      },
      "Frigorífico / Arca": {
        icon: "🧊",
        brands: ["Bosch", "Siemens", "Balay", "LG", "Samsung", "Whirlpool", "AEG", "Electrolux", "Zanussi", "Indesit", "Candy", "Liebherr", "Haier", "Beko", "Becken", "Kunft"]
      },
      "Ar Condicionado": {
        icon: "❄️",
        brands: ["Daikin", "Mitsubishi Electric", "LG", "Samsung", "Bosch", "Haier", "Fujitsu", "Panasonic", "Gree", "Toshiba", "Carrier"]
      },
      "Forno": {
        icon: "♨️",
        brands: ["Bosch", "Siemens", "Balay", "Teka", "Meireles", "Smeg", "AEG", "Electrolux", "Zanussi", "Whirlpool", "Indesit", "Candy", "Beko", "Gaggenau", "Becken", "Kunft"]
      },
      "Placa de Indução / Vitro": {
        icon: "🍳",
        brands: ["Bosch", "Siemens", "Balay", "Teka", "Smeg", "AEG", "Electrolux", "Zanussi", "Whirlpool", "Indesit", "Candy", "Beko", "Becken", "Kunft"]
      },
      "Fogão": {
        icon: "🔥",
        brands: ["Meireles", "Smeg", "Beko", "Zanussi", "Indesit", "Candy", "Teka", "Becken", "Kunft"]
      },
      "Esquentador": {
        icon: "🚿",
        brands: ["Vulcano", "Junkers", "Bosch", "Vaillant", "Becken", "Intelligent"]
      },
      "Termoacumulador": {
        icon: "⚡",
        brands: ["Ariston", "Fleck", "Vulcano", "Junkers", "Videira", "Thermor", "Teka", "Becken"]
      }
    };

    const locations = [
      "Lisboa", "Odivelas", "Almada", "Amadora", "Sintra", "Mafra", "Cascais", "Loures", 
      "Alcochete", "Palmela", "Barreiro", "Setúbal", "Montijo", "Sesimbra", "Seixal", 
      "Oeiras", "Vila Franca de Xira", "Corroios", "Costa da Caparica", "Agualva-Cacém", 
      "Ericeira", "Pontinha", "Carcavelos", "Pinhal Novo", "Algés", "Rio de Mouro", 
      "Carnaxide", "Quinta do Conde", "Benfica", "Estoril", "São Domingos de Rana", 
      "Queluz", "Massamá", "Cacilhas", "Azeitão", "Moscavide", "Sacavém", "Póvoa de Santa Iria"
    ];

    let selectedEquip = "";
    let selectedBrand = "";

    // 1. Iniciar os botões de equipamentos
    function initEquipments() {
      const grid = document.getElementById("equipmentGrid");
      for (const [eq, info] of Object.entries(dataMatrix)) {
        const btn = document.createElement("button");
        btn.className = "btn-select";
        btn.innerHTML = `${info.icon} ${eq}`;
        btn.onclick = () => selectEquipment(eq, btn);
        grid.appendChild(btn);
      }
    }

    // 2. Ação ao selecionar Equipamento
    function selectEquipment(eq, btnElement) {
      selectedEquip = eq;
      selectedBrand = ""; // Reseta a marca

      // Atualizar botões visuais
      document.querySelectorAll("#equipmentGrid .btn-select").forEach(b => b.classList.remove("active"));
      btnElement.classList.add("active");

      // Esconder passo 3 se estivesse aberto
      document.getElementById("step3").classList.add("hidden");

      // Mostrar e preencher Passo 2 (Marcas)
      const step2 = document.getElementById("step2");
      step2.classList.remove("hidden");
      
      const brandsGrid = document.getElementById("brandsGrid");
      brandsGrid.innerHTML = ""; // Limpa marcas anteriores

      // Carrega SÓ as marcas relativas a este equipamento
      const marcasPermitidas = dataMatrix[eq].brands;
      
      marcasPermitidas.forEach(marca => {
        const btn = document.createElement("button");
        btn.className = "btn-select";
        btn.innerText = marca;
        btn.onclick = () => selectBrand(marca, btn);
        brandsGrid.appendChild(btn);
      });

      // Fazer scroll suave para o passo 2
      step2.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // 3. Ação ao selecionar Marca
    function selectBrand(marca, btnElement) {
      selectedBrand = marca;

      // Atualizar botões visuais
      document.querySelectorAll("#brandsGrid .btn-select").forEach(b => b.classList.remove("active"));
      btnElement.classList.add("active");

      // Mostrar Passo 3 (Localidades)
      const step3 = document.getElementById("step3");
      step3.classList.remove("hidden");

      // Atualiza o texto de resumo
      document.getElementById("summaryText").innerText = `✓ Assistência a ${selectedEquip} ${selectedBrand}`;

      // Renderiza os links finais
      renderLocations();

      // Fazer scroll suave para o passo 3
      step3.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // 4. Renderizar a lista de localidades com o Link de WhatsApp gerado
    function renderLocations() {
      const grid = document.getElementById("locationsGrid");
      grid.innerHTML = "";

      // Ordenar alfabeticamente para facilitar a procura
      const locsOrdenadas = [...locations].sort();

      locsOrdenadas.forEach(loc => {
        const a = document.createElement("a");
        a.className = "location-card";
        a.target = "_blank";
        
        // Mensagem perfeita enviada para o WhatsApp
        const msg = encodeURIComponent(`Olá! Preciso de assistência técnica para ${selectedEquip} da marca ${selectedBrand} em ${loc}.`);
        a.href = `https://wa.me/351931369411?text=${msg}`;
        
        a.innerHTML = `📍 <span>${loc}</span> — Reparar ${selectedEquip} ${selectedBrand}`;
        grid.appendChild(a);
      });
    }

    // 5. Filtro de pesquisa de localidades
    function filterLocations() {
      const input = document.getElementById("locSearch").value.toLowerCase();
      const cards = document.querySelectorAll(".location-card");

      cards.forEach(card => {
        const text = card.textContent.toLowerCase();
        card.style.display = text.includes(input) ? "flex" : "none";
      });
    }

    // Iniciar a página
    document.addEventListener("DOMContentLoaded", initEquipments);
  </script>
</body>
</html>
