<!DOCTYPE html>
<html lang="pt-PT">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>M. Cavaleiro® | Serviço de Proximidade & Assistência Técnica</title>
  <meta name="description" content="Serviço de Proximidade M. Cavaleiro: Selecione o Equipamento e Marca Pretendida para agendamento rápido de assistência técnica na Grande Lisboa e Margem Sul.">
  <style>
    :root {
      --bg: #090a0f;
      --surface: rgba(255, 255, 255, 0.04);
      --surface-hover: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #2997ff;
      --accent-glow: rgba(41, 151, 255, 0.25);
      --green: #30d158;
      --green-glow: rgba(48, 209, 88, 0.2);
      --text: #f5f5f7;
      --text-sub: #86868b;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      padding: clamp(16px, 4vw, 32px) 12px;
      min-height: 100vh;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 36px;
    }

    .badge-top {
      display: inline-block;
      background: rgba(41, 151, 255, 0.12);
      border: 1px solid rgba(41, 151, 255, 0.3);
      color: var(--accent);
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(1.8rem, 4.5vw, 2.6rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-sub);
      font-size: 1.05rem;
    }

    /* Passos do Funil */
    .step-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: clamp(18px, 3vw, 28px);
      margin-bottom: 20px;
      backdrop-filter: blur(16px);
      transition: all 0.3s ease;
    }

    .step-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
    }

    .step-number {
      background: var(--accent);
      color: #fff;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 0.9rem;
      font-weight: 800;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* Grelha de Seleção */
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px;
    }

    .btn-select {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text);
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .btn-select:hover {
      background: var(--surface-hover);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .btn-select.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    /* Barra de Pesquisa e Grelha de Localidades */
    .search-bar {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      padding: 14px 18px;
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .locations-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 10px;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 6px;
    }

    .locations-grid::-webkit-scrollbar { width: 6px; }
    .locations-grid::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }

    .location-card {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 16px;
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.88rem;
      transition: all 0.2s ease;
    }

    .location-card:hover {
      background: var(--green-glow);
      border-color: var(--green);
      color: #fff;
      transform: translateY(-1px);
    }

    .location-card strong { color: var(--green); font-weight: 700; }

    .summary-badge {
      background: rgba(48, 209, 88, 0.12);
      border: 1px solid rgba(48, 209, 88, 0.3);
      color: var(--green);
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 600;
      margin-bottom: 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.98rem;
    }

    .hidden { display: none !important; }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <span class="badge-top">Serviço de Proximidade</span>
      <h1>M. CAVALEIRO®</h1>
      <p class="subtitle">Selecione o Equipamento & Marca Pretendida para Assistência Imediata</p>
    </header>

    <!-- PASSO 1: EQUIPAMENTO -->
    <div class="step-box" id="step1">
      <div class="step-title"><span class="step-number">1</span> Selecione o Equipamento</div>
      <div class="btn-grid" id="equipmentGrid">
        <!-- Injetado via JS -->
      </div>
    </div>

    <!-- PASSO 2: MARCA (Filtrada estritamente por equipamento) -->
    <div class="step-box hidden" id="step2">
      <div class="step-title"><span class="step-number">2</span> Selecione a Marca Pretendida</div>
      <div class="btn-grid" id="brandsGrid">
        <!-- Injetado via JS dinamicamente -->
      </div>
    </div>

    <!-- PASSO 3: LOCALIDADE & CONTACTO DIRETO -->
    <div class="step-box hidden" id="step3">
      <div class="step-title"><span class="step-number">3</span> Selecione a sua Localidade</div>
      
      <div class="summary-badge" id="summaryText"></div>
      
      <input type="text" id="locSearch" class="search-bar" placeholder="🔍 Pesquisar localidade (ex: Almada, Sintra, Cascais, Odivelas...)" onkeyup="filterLocations()">
      <div class="locations-grid" id="locationsGrid">
        <!-- Injetado via JS dinamicamente -->
      </div>
    </div>

  </div>

  <script>
    // MATRIZ COMPLETA E RIGOROSA DE EQUIPAMENTOS E MARCAS REAIS
    const dataMatrix = {
      "Máquina de Lavar Roupa": {
        icon: "🧺",
        brands: ["Bosch", "Siemens", "Balay", "LG", "Samsung", "Whirlpool", "AEG", "Electrolux", "Zanussi", "Indesit", "Candy", "Hoover", "Miele", "Beko", "Hotpoint-Ariston", "Haier", "Becken", "Kunft", "Fagor", "Brandt"]
      },
      "Máquina de Secar Roupa": {
        icon: "👕",
        brands: ["Bosch", "Siemens", "Balay", "LG", "Samsung", "Whirlpool", "AEG", "Electrolux", "Zanussi", "Indesit", "Candy", "Hoover", "Miele", "Beko", "Hotpoint-Ariston", "Haier", "Becken", "Kunft"]
      },
      "Máquina de Lavar Louça": {
        icon: "🍽️",
        brands: ["Bosch", "Siemens", "Balay", "Whirlpool", "AEG", "Electrolux", "Zanussi", "Indesit", "Candy", "Miele", "Beko", "Hotpoint-Ariston", "Teka", "Smeg", "Haier", "Becken", "Kunft"]
      },
      "Frigorífico / Combinado": {
        icon: "🧊",
        brands: ["Bosch", "Siemens", "Balay", "LG", "Samsung", "Whirlpool", "AEG", "Electrolux", "Zanussi", "Indesit", "Candy", "Liebherr", "Haier", "Beko", "Hotpoint-Ariston", "Hisense", "Smeg", "Becken", "Kunft"]
      },
      "Arca Congeladora": {
        icon: "❄️",
        brands: ["Bosch", "Siemens", "Balay", "Whirlpool", "Liebherr", "Beko", "Haier", "Zanussi", "Indesit", "Electrolux", "Candy", "Hisense", "Becken", "Kunft"]
      },
      "Garrafeira Climatizada": {
        icon: "🍷",
        brands: ["Liebherr", "Avintage", "La Sommelière", "Caso", "Teka", "Smeg", "Candy", "Haier", "Bosch"]
      },
      "Ar Condicionado / Higa": {
        icon: "🌡️",
        brands: ["Daikin", "Mitsubishi Electric", "LG", "Samsung", "Bosch", "Haier", "Fujitsu", "Panasonic", "Gree", "Toshiba", "Carrier", "Midea", "Hisense", "Daitsu"]
      },
      "Forno Elétrico / Encastre": {
        icon: "♨️",
        brands: ["Bosch", "Siemens", "Balay", "Teka", "Meireles", "Smeg", "AEG", "Electrolux", "Zanussi", "Whirlpool", "Indesit", "Candy", "Beko", "Gaggenau", "Franke", "Hotpoint-Ariston", "Becken", "Kunft"]
      },
      "Placa Indução / Vitro / Gás": {
        icon: "🍳",
        brands: ["Bosch", "Siemens", "Balay", "Teka", "Smeg", "Meireles", "AEG", "Electrolux", "Zanussi", "Whirlpool", "Indesit", "Candy", "Beko", "Franke", "Becken", "Kunft"]
      },
      "Fogão": {
        icon: "🔥",
        brands: ["Meireles", "Smeg", "Teka", "Beko", "Zanussi", "Indesit", "Candy", "Hotpoint-Ariston", "Becken", "Kunft"]
      },
      "Exaustor / Hotte": {
        icon: "💨",
        brands: ["Teka", "Bosch", "Siemens", "Balay", "Faber", "Cata", "Meireles", "Smeg", "AEG", "Electrolux", "Zanussi", "Candy", "Beko", "Franke"]
      },
      "Esquentador": {
        icon: "🚿",
        brands: ["Vulcano", "Junkers", "Bosch", "Vaillant", "Ariston", "Cointra", "Fagor", "Becken", "Intelligent"]
      },
      "Caldeira a Gás / Mural": {
        icon: "🔥",
        brands: ["Vulcano", "Junkers", "Bosch", "Vaillant", "Baxi", "Ferroli", "Ariston", "Saunier Duval", "Chaffoteaux", "Beretta"]
      },
      "Termoacumulador / Cilindro": {
        icon: "⚡",
        brands: ["Ariston", "Fleck", "Vulcano", "Junkers", "Videira", "Thermor", "Teka", "Bosch", "Atlantic", "Becken"]
      },
      "Micro-ondas Encastre": {
        icon: "📻",
        brands: ["Bosch", "Siemens", "Balay", "Teka", "Whirlpool", "Samsung", "LG", "Panasonic", "Candy", "Smeg", "AEG", "Electrolux", "Becken", "Kunft"]
      }
    };

    const locations = [
      "Lisboa", "Odivelas", "Almada", "Amadora", "Sintra", "Mafra", "Cascais", "Loures", 
      "Alcochete", "Palmela", "Barreiro", "Setúbal", "Montijo", "Sesimbra", "Seixal", 
      "Oeiras", "Vila Franca de Xira", "Corroios", "Costa da Caparica", "Agualva-Cacém", 
      "Ericeira", "Pontinha", "Carcavelos", "Pinhal Novo", "Algés", "Rio de Mouro", 
      "Carnaxide", "Quinta do Conde", "Benfica", "Estoril", "São Domingos de Rana", 
      "Queluz", "Massamá", "Cacilhas", "Azeitão", "Moscavide", "Sacavém", "Póvoa de Santa Iria",
      "Alverca", "Belas", "Paço de Arcos", "Parede", "Alcabideche", "Ramada", "Prior Velho"
    ];

    let selectedEquip = "";
    let selectedBrand = "";

    // 1. Renderizar lista inicial de equipamentos
    function initEquipments() {
      const grid = document.getElementById("equipmentGrid");
      grid.innerHTML = "";
      
      for (const [eq, info] of Object.entries(dataMatrix)) {
        const btn = document.createElement("button");
        btn.className = "btn-select";
        btn.innerHTML = `<span>${info.icon}</span> <span>${eq}</span>`;
        btn.onclick = () => selectEquipment(eq, btn);
        grid.appendChild(btn);
      }
    }

    // 2. Seleção do Equipamento
    function selectEquipment(eq, btnElement) {
      selectedEquip = eq;
      selectedBrand = "";

      document.querySelectorAll("#equipmentGrid .btn-select").forEach(b => b.classList.remove("active"));
      btnElement.classList.add("active");

      document.getElementById("step3").classList.add("hidden");

      const step2 = document.getElementById("step2");
      step2.classList.remove("hidden");
      
      const brandsGrid = document.getElementById("brandsGrid");
      brandsGrid.innerHTML = "";

      // Filtra APENAS as marcas correspondentes a este equipamento
      const marcas = dataMatrix[eq].brands.sort();
      marcas.forEach(marca => {
        const btn = document.createElement("button");
        btn.className = "btn-select";
        btn.innerText = marca;
        btn.onclick = () => selectBrand(marca, btn);
        brandsGrid.appendChild(btn);
      });

      step2.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // 3. Seleção da Marca
    function selectBrand(marca, btnElement) {
      selectedBrand = marca;

      document.querySelectorAll("#brandsGrid .btn-select").forEach(b => b.classList.remove("active"));
      btnElement.classList.add("active");

      const step3 = document.getElementById("step3");
      step3.classList.remove("hidden");

      document.getElementById("summaryText").innerHTML = `✓ Pedido: <strong>${selectedEquip} ${selectedBrand}</strong>`;

      renderLocations();
      step3.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // 4. Renderizar a grelha de localidades com o link do WhatsApp
    function renderLocations() {
      const grid = document.getElementById("locationsGrid");
      grid.innerHTML = "";

      const locsOrdenadas = [...locations].sort();

      locsOrdenadas.forEach(loc => {
        const a = document.createElement("a");
        a.className = "location-card";
        a.target = "_blank";
        
        const msg = encodeURIComponent(`Olá! Preciso de assistência técnica para ${selectedEquip} da marca ${selectedBrand} em ${loc}.`);
        a.href = `https://wa.me/351931369411?text=${msg}`;
        
        a.innerHTML = `📍 <strong>${loc}</strong> — Assistência ${selectedEquip} ${selectedBrand}`;
        grid.appendChild(a);
      });
    }

    // 5. Filtro de pesquisa rápida de localidades
    function filterLocations() {
      const input = document.getElementById("locSearch").value.toLowerCase();
      const cards = document.querySelectorAll(".location-card");

      cards.forEach(card => {
        const text = card.textContent.toLowerCase();
        card.style.display = text.includes(input) ? "flex" : "none";
      });
    }

    document.addEventListener("DOMContentLoaded", initEquipments);
  </script>
</body>
</html>
