name: Programmatic SEO Generator

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Generate HTML Pages
        run: node generate.js

      - name: Commit and Push Generated Pages
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "bot@mcavaleiro.pt"
          git add *.html
          git commit -m "Auto-generate programmatic SEO pages" || echo "Sem novas alterações para guardar"
          git push
