name: Deploy Programmatic SEO Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run SEO Generator Script
        run: node generate.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

        // Criar Sitemap.xml automático
let urlsSitemap = [
  '  <url><loc>https://mcavaleiro.pt/</loc><priority>1.0</priority></url>'
];

marcas.forEach(marca => {
  zonas.forEach(zona => {
    const pageUrl = `https://mcavaleiro.pt/reparacao-frigorificos-${marca.slug}-${zona.slug}.html`;
    urlsSitemap.push(`  <url><loc>${pageUrl}</loc><priority>0.8</priority></url>`);
  });
});

const sitemapContent = `<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
${urlsSitemap.join('\n')}
</urlset>`;

fs.writeFileSync('sitemap.xml', sitemapContent);
console.log("Sitemap.xml gerado com sucesso!");
